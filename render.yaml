services:
  - type: web
    name: luweero-build-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_DATABASE_URL
        sync: false
      - key: CLOUD_STORAGE_PUBLIC_BASE_URL
        sync: false
      - key: CLOUD_STORAGE_BUCKET
        sync: false
      - key: CLOUD_STORAGE_ACCESS_KEY_ID
        sync: false
      - key: CLOUD_STORAGE_SECRET_ACCESS_KEY
        sync: false
